<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS50.ai Backup</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>CS50.ai Backup</h1>
      <p id="status" class="status" data-state="not_configured">Not configured</p>
      <p id="meta" class="meta"></p>
      <div class="actions">
        <button type="button" id="pick-file" class="secondary">Choose backup folder…</button>
        <button type="button" id="reset-config" class="secondary">Reset configuration</button>
        <button type="button" id="refresh" class="primary" disabled>Refresh Backup</button>
      </div>
      <p id="folder-diag" class="folder-diag" hidden></p>
      <section class="split-panel" aria-labelledby="split-title">
        <h2 id="split-title">Split Backup</h2>
        <p class="split-desc">Split the existing backup into multiple Markdown files (pair-safe).</p>
        <div class="split-mode">
          <label class="radio">
            <input type="radio" name="split-mode" value="pairs_per_file" checked />
            By Q&amp;A pairs per file
          </label>
          <label class="radio">
            <input type="radio" name="split-mode" value="max_mb" />
            By maximum file size (MB)
          </label>
        </div>
        <label class="field" id="split-field-pairs">
          <span>Q&amp;A pairs per file</span>
          <input type="number" id="split-pairs" min="1" step="1" value="1" />
        </label>
        <label class="field field-hidden" id="split-field-mb">
          <span>Maximum file size (MB)</span>
          <input type="number" id="split-mb" min="0.001" step="0.1" value="10" />
        </label>
        <button type="button" id="split-count" class="secondary" disabled>Count parts to split</button>
        <button type="button" id="split-backup" class="secondary" disabled>Split Backup</button>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
